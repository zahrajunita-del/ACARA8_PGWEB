
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Kecamatan</title>
</head>
<body>

    <h2>Form Input Data Kecamatan</h2>

    <form action="input.php" method="post"
          onsubmit="return validateForm()">

        <label for="kecamatan">Nama Kecamatan:</label><br>
        <input type="text" id="kecamatan"
               name="kecamatan" required><br><br>

        <label for="longitude">Longitude:</label><br>
        <input type="number" id="longitude"
               name="longitude" step="any"
               min="-180" max="180" required><br><br>

        <label for="latitude">Latitude:</label><br>
        <input type="number" id="latitude"
               name="latitude" step="any"
               min="-90" max="90" required><br><br>

        <label for="luas">Luas (km²):</label><br>
        <input type="number" id="luas"
               name="luas" step="any" min="0.01"
               required><br><br>

        <label for="jumlah_penduduk">Jumlah Penduduk:</label><br>
        <input type="number" id="jumlah_penduduk"
               name="jumlah_penduduk" min="1"
               step="1" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <p id="informasi" style="color:red;"></p>

    <script>
        function validateForm() {
            const kecamatan =
                document.getElementById("kecamatan").value.trim();

            const luas =
                Number(document.getElementById("luas").value);

            const jumlah =
                Number(document.getElementById("jumlah_penduduk").value);

            const informasi =
                document.getElementById("informasi");

            informasi.textContent = "";

            if (kecamatan === "") {
                informasi.textContent =
                    "Nama kecamatan wajib diisi.";
                return false;
            }

            if (!Number.isFinite(luas) || luas <= 0) {
                informasi.textContent =
                    "Luas harus berupa angka lebih dari 0.";
                return false;
            }

            if (!Number.isInteger(jumlah) || jumlah < 1) {
                informasi.textContent =
                    "Jumlah penduduk harus bilangan bulat positif.";
                return false;
            }

            return true;
        }
    </script>

</body>
</html>
